name: test

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Front-end panel parse gate (part of npm test, asserted explicitly for visibility)
        run: node --input-type=module -e "await import('./extension/index.js'); console.log('panel parse OK')"
